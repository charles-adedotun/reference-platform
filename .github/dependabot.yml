# Dependabot configuration for automated dependency updates
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # Go modules
  - package-ecosystem: "gomod"
    directory: "/apps/taskflow"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      go-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Legacy correlator cleanup entry (clears orphaned dependabot-go_modules-apps-taskflow graph snapshot)
  - package-ecosystem: "gomod"
    directory: "/apps-taskflow"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 0

  # Docker images
  - package-ecosystem: "docker"
    directory: "/apps/taskflow/build"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Terraform (AWS)
  - package-ecosystem: "terraform"
    directories:
      - "/infra/terraform/bootstrap/aws"
      - "/infra/terraform/environments/aws/*"
      - "/infra/terraform/modules/aws/*"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "terraform"
      - "aws"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Terraform (GCP)
  - package-ecosystem: "terraform"
    directories:
      - "/infra/terraform/bootstrap/gcp"
      - "/infra/terraform/environments/gcp/*"
      - "/infra/terraform/modules/gcp/*"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "terraform"
      - "gcp"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

# Dependabot configuration for automated dependency updates
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # Go modules
  - package-ecosystem: "gomod"
    directory: "/apps/taskflow"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 0

  # Docker images
  - package-ecosystem: "docker"
    directory: "/apps/taskflow/build"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 0

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 0

  # Terraform (AWS)
  - package-ecosystem: "terraform"
    directories:
      - "/infra/terraform/bootstrap/aws"
      - "/infra/terraform/environments/aws/*"
      - "/infra/terraform/modules/aws/*"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 0

  # Terraform (GCP)
  - package-ecosystem: "terraform"
    directories:
      - "/infra/terraform/bootstrap/gcp"
      - "/infra/terraform/environments/gcp/*"
      - "/infra/terraform/modules/gcp/*"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 0

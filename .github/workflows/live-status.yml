name: Live Status

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check-status:
    name: Check Service Status
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check endpoints
        id: check
        env:
          HEALTH_CHECK_URL: ${{ secrets.HEALTH_CHECK_URL || 'https://example.com/health' }}
        run: |
          # Initialize variables
          timestamp=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          all_healthy=true

          # Function to check endpoint
          check_endpoint() {
            local url=$1
            local name=$2
            local response_code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$url" || echo "000")
            local response_time=$(curl -s -o /dev/null -w "%{time_total}" --max-time 10 "$url" || echo "timeout")
            
            if [ "$response_code" = "200" ] || [ "$response_code" = "204" ]; then
              echo "$name|✅ Operational|HTTP $response_code|${response_time}s"
            elif [ "$response_code" = "000" ]; then
              echo "$name|❌ Down|Connection failed|N/A"
              all_healthy=false
            else
              echo "$name|⚠️ Degraded|HTTP $response_code|${response_time}s"
              all_healthy=false
            fi
          }

          # Create results file
          echo "# Live Service Status" > status_report.txt
          echo "" >> status_report.txt
          echo "Last updated: **$timestamp**" >> status_report.txt
          echo "" >> status_report.txt
          echo "| Service | Status | Details | Response Time |" >> status_report.txt
          echo "|---------|--------|---------|---------------|" >> status_report.txt

          # Check main health endpoint
          check_endpoint "$HEALTH_CHECK_URL" "Main API" >> status_report.txt

          # Check additional endpoints if configured
          if [ -n "${{ secrets.ADDITIONAL_ENDPOINTS }}" ]; then
            # Parse comma-separated endpoints
            IFS=',' read -ra ENDPOINTS <<< "${{ secrets.ADDITIONAL_ENDPOINTS }}"
            for endpoint in "${ENDPOINTS[@]}"; do
              # Split on pipe: name|url
              IFS='|' read -r name url <<< "$endpoint"
              check_endpoint "$url" "$name" >> status_report.txt
            done
          fi

          echo "" >> status_report.txt
          echo "---" >> status_report.txt
          echo "" >> status_report.txt
          
          if [ "$all_healthy" = true ]; then
            echo "**Overall Status:** ✅ All Systems Operational" >> status_report.txt
          else
            echo "**Overall Status:** ⚠️ Some Services Degraded or Down" >> status_report.txt
          fi

          echo "" >> status_report.txt
          echo "*This status page is automatically updated every 6 hours by GitHub Actions.*" >> status_report.txt

          # Set output for next step
          echo "all_healthy=$all_healthy" >> $GITHUB_OUTPUT

      - name: Update LIVE_STATUS.md
        run: |
          mv status_report.txt LIVE_STATUS.md

      - name: Commit and push changes
        env:
          ACTOR: ${{ github.actor }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if git diff --quiet LIVE_STATUS.md; then
            echo "No changes to LIVE_STATUS.md"
          else
            git add LIVE_STATUS.md
            git commit -m "chore: update live status [skip ci]"
            git push
          fi

      - name: Create issue if services are down
        if: steps.check.outputs.all_healthy != 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const statusContent = fs.readFileSync('LIVE_STATUS.md', 'utf8');
            
            // Check if there's already an open issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'service-down,automated'
            });

            if (issues.data.length === 0) {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '⚠️ Service Health Check Failed',
                body: `## Service Status Alert\n\nOne or more services are not responding correctly.\n\n${statusContent}\n\n---\n*This issue was automatically created by the Live Status workflow.*`,
                labels: ['service-down', 'automated', 'priority-high']
              });
            } else {
              // Update existing issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: `## Updated Status Report\n\n${statusContent}`
              });
            }

  notify-slack:
    name: Notify Slack
    runs-on: ubuntu-latest
    needs: check-status
    if: failure() && secrets.SLACK_WEBHOOK_URL != ''
    steps:
      - name: Send Slack notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d '{
              "text": "⚠️ Live Status Check Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Live Status Check Failed*\nOne or more services are experiencing issues. Check the status page for details."
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Workflow:*\n${{ github.workflow }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Repository:*\n${{ github.repository }}"
                    }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Workflow Run"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }'

apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-components
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - name: kyverno
            namespace: kyverno
            wave: "-5"
          - name: gateway-api-crds
            namespace: gateway-system
            wave: "-4"
          - name: external-secrets
            namespace: external-secrets
            wave: "-3"
          - name: cert-manager
            namespace: cert-manager
            wave: "-2"
          - name: envoy-gateway
            namespace: envoy-gateway-system
            wave: "-1"
          - name: kube-prometheus-stack
            namespace: monitoring
            wave: "0"
          - name: loki-stack
            namespace: monitoring
            wave: "1"
          - name: opentelemetry-collector
            namespace: opentelemetry
            wave: "2"
  template:
    metadata:
      name: "platform-{{ .name }}"
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "{{ .wave }}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/yourusername/reference-platform.git
        targetRevision: main
        path: "gitops/platform/{{ .name }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
      ignoreDifferences:
        - group: kyverno.io
          kind: ClusterPolicy
          jqPathExpressions:
            - .spec.webhookTimeoutSeconds

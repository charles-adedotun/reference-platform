# Default values for taskflow.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  nameOverride: ""
  fullnameOverride: ""

# API service configuration
api:
  enabled: true
  replicaCount: 3

  image:
    repository: taskflow/api
    pullPolicy: IfNotPresent
    tag: ""  # Overrides the image tag whose default is the chart appVersion.

  imagePullSecrets: []

  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
    annotations: {}
    # Use NodePort for local development (e.g., Kind)
    nodePort: null

  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  # Health check probes
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /ready
      port: http
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

  # Horizontal Pod Autoscaler
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  # Pod Disruption Budget
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  # Security context
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000

  # Environment variables
  env: []

  # Node selector
  nodeSelector: {}

  # Tolerations
  tolerations: []

  # Affinity rules
  affinity: {}

  # Additional annotations
  podAnnotations: {}

# Worker service configuration
worker:
  enabled: true
  replicaCount: 5

  image:
    repository: taskflow/worker
    pullPolicy: IfNotPresent
    tag: ""

  imagePullSecrets: []

  # Worker-specific configuration
  concurrency: 10
  queues:
    - default
    - high-priority
    - low-priority

  resources:
    requests:
      cpu: 1000m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 2Gi

  # Horizontal Pod Autoscaler
  autoscaling:
    enabled: true
    minReplicas: 5
    maxReplicas: 20
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 85

  # Security context
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000

  # Environment variables
  env: []

  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# Cron job configuration
cron:
  enabled: true

  image:
    repository: taskflow/cron
    pullPolicy: IfNotPresent
    tag: ""

  imagePullSecrets: []

  # Cron schedule (run cleanup tasks daily at 2 AM)
  schedule: "0 2 * * *"

  # Job configuration
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  concurrencyPolicy: Forbid
  restartPolicy: OnFailure

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Security context
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000

  env: []
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Database migration job
migration:
  enabled: true

  image:
    repository: taskflow/migration
    pullPolicy: IfNotPresent
    tag: ""

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Security context
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000

# PostgreSQL configuration
# SECURITY WARNING: For production deployments:
# 1. NEVER commit passwords to version control
# 2. Use existingSecret to reference a pre-created Kubernetes secret
# 3. Create secrets via: kubectl create secret generic taskflow-postgresql --from-literal=postgres-password=<secure-password>
# 4. Or use external secret management (Vault, AWS Secrets Manager, etc.)
postgresql:
  enabled: true

  image:
    repository: postgres
    tag: "15-alpine"
    pullPolicy: IfNotPresent

  auth:
    database: taskflow
    username: taskflow
    # DEVELOPMENT ONLY: Set via --set postgresql.auth.password=xxx
    # PRODUCTION: Use existingSecret instead (see SECURITY WARNING above)
    password: ""
    # Production: reference a pre-created secret containing 'postgres-password' key
    existingSecret: ""  # e.g., "taskflow-postgresql-secret"

  persistence:
    enabled: true
    storageClass: ""
    size: 10Gi
    accessModes:
      - ReadWriteOnce

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  service:
    type: ClusterIP
    port: 5432

  # Security context
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    fsGroup: 999

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    # Note: PostgreSQL requires writable filesystem for initialization
    readOnlyRootFilesystem: false
    runAsNonRoot: true
    runAsUser: 999

# Redis configuration
# SECURITY WARNING: Same guidance as PostgreSQL applies - see above
redis:
  enabled: true

  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent

  auth:
    enabled: true
    # DEVELOPMENT ONLY: Set via --set redis.auth.password=xxx
    # PRODUCTION: Use existingSecret instead
    password: ""
    # Production: reference a pre-created secret containing 'redis-password' key
    existingSecret: ""  # e.g., "taskflow-redis-secret"

  persistence:
    enabled: true
    storageClass: ""
    size: 5Gi
    accessModes:
      - ReadWriteOnce

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  service:
    type: ClusterIP
    port: 6379

  # Security context
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    fsGroup: 999

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: false
    runAsNonRoot: true
    runAsUser: 999

# Telemetry configuration
telemetry:
  enabled: true
  namespace: monitoring
  endpoint: "http://otel-collector:4317"
  sampleRate: 0.1

  # Environment for telemetry
  serviceName: taskflow
  serviceVersion: "0.1.0"
  environment: production

# Network Policy
networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress

  # Ingress rules
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: taskflow

  # Egress rules
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: taskflow
    - to:  # Allow DNS
        - namespaceSelector:
            matchLabels:
              name: kube-system
      ports:
        - protocol: UDP
          port: 53

# Service Account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Additional configuration
config:
  # Application configuration
  logLevel: info
  environment: production

  # Database configuration
  database:
    maxConnections: 100
    connectionTimeout: 30
    # SSL mode for database connections:
    # - disable: No SSL (dev only, NOT for production)
    # - require: Use SSL but don't verify certificate (minimum for production)
    # - verify-ca: Verify server certificate against CA
    # - verify-full: Verify server certificate and hostname (most secure)
    sslMode: require  # Options: disable (dev only), require, verify-ca, verify-full

  # Task configuration
  task:
    defaultTimeout: 300
    maxRetries: 3
    retryDelay: 60

{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "taskflow.fullname" . }}-worker
  labels:
    {{- include "taskflow.worker.labels" . | nindent 4 }}
spec:
  {{- if not .Values.worker.autoscaling.enabled }}
  replicas: {{ .Values.worker.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "taskflow.worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.worker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "taskflow.worker.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "taskflow.serviceAccountName" . }}
      {{- with .Values.worker.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.worker.podSecurityContext | nindent 8 }}
      containers:
      - name: worker
        image: {{ include "taskflow.worker.image" . }}
        imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
        securityContext:
          {{- toYaml .Values.worker.securityContext | nindent 10 }}
        env:
        {{- include "taskflow.commonEnv" . | nindent 8 }}
        - name: WORKER_CONCURRENCY
          value: {{ .Values.worker.concurrency | quote }}
        - name: WORKER_QUEUES
          value: {{ join "," .Values.worker.queues | quote }}
        - name: TASK_DEFAULT_TIMEOUT
          value: {{ .Values.config.task.defaultTimeout | quote }}
        - name: TASK_MAX_RETRIES
          value: {{ .Values.config.task.maxRetries | quote }}
        - name: TASK_RETRY_DELAY
          value: {{ .Values.config.task.retryDelay | quote }}
        {{- with .Values.worker.env }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        resources:
          {{- toYaml .Values.worker.resources | nindent 10 }}
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/.cache
      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

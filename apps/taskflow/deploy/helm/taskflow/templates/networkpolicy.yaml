{{- if .Values.networkPolicy.enabled }}
---
# Network Policy for API
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "taskflow.fullname" . }}-api
  labels:
    {{- include "taskflow.api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "taskflow.api.selectorLabels" . | nindent 6 }}
  policyTypes:
    {{- toYaml .Values.networkPolicy.policyTypes | nindent 4 }}
  ingress:
  # Allow ingress from anywhere on HTTP port
  - ports:
    - protocol: TCP
      port: {{ .Values.api.service.targetPort }}
  egress:
  # Allow egress to PostgreSQL
  - to:
    - podSelector:
        matchLabels:
          {{- include "taskflow.postgresql.selectorLabels" . | nindent 10 }}
    ports:
    - protocol: TCP
      port: {{ .Values.postgresql.service.port }}
  # Allow egress to Redis
  - to:
    - podSelector:
        matchLabels:
          {{- include "taskflow.redis.selectorLabels" . | nindent 10 }}
    ports:
    - protocol: TCP
      port: {{ .Values.redis.service.port }}
  # Allow DNS
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
  {{- if .Values.telemetry.enabled }}
  # Allow egress to telemetry endpoint
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .Values.telemetry.namespace | default "monitoring" }}
      podSelector:
        matchLabels:
          app.kubernetes.io/name: opentelemetry-collector
    ports:
    - protocol: TCP
      port: 4317
    - protocol: TCP
      port: 4318
  {{- end }}

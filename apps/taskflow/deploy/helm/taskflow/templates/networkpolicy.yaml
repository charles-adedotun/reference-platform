  podSelector:
    matchLabels:
      {{- include "taskflow.postgresql.selectorLabels" . | nindent 6 }}
  policyTypes:
    {{- toYaml .Values.networkPolicy.policyTypes | nindent 4 }}
  ingress:
  # Allow ingress from API
  - from:
    - podSelector:
        matchLabels:
          {{- include "taskflow.api.selectorLabels" . | nindent 10 }}
    ports:
    - protocol: TCP
      port: {{ .Values.postgresql.service.port }}
  # Allow ingress from Worker
  - from:
    - podSelector:
        matchLabels:
          {{- include "taskflow.worker.selectorLabels" . | nindent 10 }}
    ports:
    - protocol: TCP
      port: {{ .Values.postgresql.service.port }}
  # Allow ingress from Migration
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: migration
    ports:
    - protocol: TCP
      port: {{ .Values.postgresql.service.port }}
  # Allow ingress from Cron
  - from:
    - podSelector:
        matchLabels:
          {{- include "taskflow.cron.selectorLabels" . | nindent 10 }}
    ports:
    - protocol: TCP
      port: {{ .Values.postgresql.service.port }}
  egress:
  # Allow DNS
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53

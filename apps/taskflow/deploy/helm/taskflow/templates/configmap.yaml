apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "taskflow.fullname" . }}
  labels:
    {{- include "taskflow.labels" . | nindent 4 }}
data:
  # Application configuration
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  ENVIRONMENT: {{ .Values.config.environment | quote }}

  # Database configuration
  DB_MAX_CONNECTIONS: {{ .Values.config.database.maxConnections | quote }}
  DB_CONNECTION_TIMEOUT: {{ .Values.config.database.connectionTimeout | quote }}

  # Task configuration
  TASK_DEFAULT_TIMEOUT: {{ .Values.config.task.defaultTimeout | quote }}
  TASK_MAX_RETRIES: {{ .Values.config.task.maxRetries | quote }}
  TASK_RETRY_DELAY: {{ .Values.config.task.retryDelay | quote }}

  {{- if .Values.telemetry.enabled }}
  # Telemetry configuration
  TELEMETRY_ENABLED: "true"
  OTEL_SERVICE_NAME: {{ .Values.telemetry.serviceName | quote }}
  OTEL_SERVICE_VERSION: {{ .Values.telemetry.serviceVersion | quote }}
  OTEL_ENVIRONMENT: {{ .Values.telemetry.environment | quote }}
  {{- else }}
  TELEMETRY_ENABLED: "false"
  {{- end }}

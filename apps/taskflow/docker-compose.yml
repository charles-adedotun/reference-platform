version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: taskflow-postgres
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./internal/database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: taskflow-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: build/Dockerfile.api
    container_name: taskflow-api
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      SERVICE_NAME: taskflow
      DATABASE_URL: postgres://taskflow:taskflow123@postgres:5432/taskflow?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      SHUTDOWN_TIMEOUT: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: build/Dockerfile.worker
    container_name: taskflow-worker
    environment:
      SERVICE_NAME: taskflow
      DATABASE_URL: postgres://taskflow:taskflow123@postgres:5432/taskflow?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      SHUTDOWN_TIMEOUT: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  cron:
    build:
      context: .
      dockerfile: build/Dockerfile.cron
    container_name: taskflow-cron
    environment:
      SERVICE_NAME: taskflow
      DATABASE_URL: postgres://taskflow:taskflow123@postgres:5432/taskflow?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      SHUTDOWN_TIMEOUT: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: envoy-gateway-system

resources:
  - gateway-class.yaml
  - gateway.yaml

helmCharts:
  - name: gateway-helm
    repo: https://gateway.envoyproxy.io
    version: v1.2.4
    releaseName: envoy-gateway
    namespace: envoy-gateway-system
    valuesFile: values.yaml

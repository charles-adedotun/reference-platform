apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: observability
  labels:
    app: opentelemetry-collector
data:
  config.yaml: |
    # OpenTelemetry Collector Configuration
    # OTLP receiver, batch processor, and exporters

    receivers:
      # OTLP gRPC and HTTP receivers
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
            max_recv_msg_size_mib: 4
            max_concurrent_streams: 100
          http:
            endpoint: 0.0.0.0:4318
            cors:
              allowed_origins:
                - "*"

      # Jaeger receivers for backward compatibility
      jaeger:
        protocols:
          grpc:
            endpoint: 0.0.0.0:14250
          thrift_http:
            endpoint: 0.0.0.0:14268

      # Zipkin receiver
      zipkin:
        endpoint: 0.0.0.0:9411

      # Prometheus receiver for scraping
      prometheus:
        config:
          scrape_configs:
            - job_name: 'otel-collector'
              scrape_interval: 30s
              static_configs:
                - targets: ['0.0.0.0:8888']

    processors:
      # Memory limiter to prevent OOM
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15

      # Batch processor for efficient sending
      batch:
        timeout: 10s
        send_batch_size: 1024
        send_batch_max_size: 2048

      # Resource processor to add metadata
      resource:
        attributes:
          - key: service.instance.id
            from_attribute: k8s.pod.uid
            action: insert
          - key: k8s.cluster.name
            value: kind-cluster
            action: upsert
          - key: deployment.environment
            value: development
            action: insert

      # K8s attributes processor
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        filter:
          node_from_env_var: K8S_NODE_NAME
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.deployment.name
            - k8s.statefulset.name
            - k8s.daemonset.name
            - k8s.cronjob.name
            - k8s.job.name
            - k8s.node.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.pod.start_time
          labels:
            - tag_name: app.label.component
              key: app.kubernetes.io/component
              from: pod
            - tag_name: app.label.name
              key: app.kubernetes.io/name
              from: pod
            - tag_name: app.label.version
              key: app.kubernetes.io/version
              from: pod
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: connection

    exporters:
      # Debug exporter for development
      debug:
        verbosity: detailed
        sampling_initial: 5
        sampling_thereafter: 200

      # OTLP exporter (disabled by default, configure for production)
      # otlp:
      #   endpoint: your-backend:4317
      #   tls:
      #     insecure: false
      #     cert_file: /etc/certs/cert.pem
      #     key_file: /etc/certs/key.pem

      # Prometheus exporter
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: otel
        const_labels:
          cluster: kind-cluster
          environment: development
        resource_to_telemetry_conversion:
          enabled: true

      # Logging exporter for debugging
      logging:
        verbosity: normal
        sampling_initial: 5
        sampling_thereafter: 200

    extensions:
      # Health check extension
      health_check:
        endpoint: 0.0.0.0:13133
        path: /health

      # pprof extension for profiling
      pprof:
        endpoint: 0.0.0.0:1777

      # zpages extension for debugging
      zpages:
        endpoint: 0.0.0.0:55679

    service:
      extensions: [health_check, pprof, zpages]

      pipelines:
        # Traces pipeline
        traces:
          receivers: [otlp, jaeger, zipkin]
          processors: [memory_limiter, k8sattributes, resource, batch]
          exporters: [debug, logging]

        # Metrics pipeline
        metrics:
          receivers: [otlp, prometheus]
          processors: [memory_limiter, k8sattributes, resource, batch]
          exporters: [debug, prometheus, logging]

        # Logs pipeline
        logs:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resource, batch]
          exporters: [debug, logging]

      # Telemetry configuration
      telemetry:
        logs:
          level: info
        metrics:
          address: 0.0.0.0:8888
          level: detailed

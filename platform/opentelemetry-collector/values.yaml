# OpenTelemetry Collector Helm values
# Telemetry collection and export configuration

# Mode: deployment, daemonset, or statefulset
mode: deployment

# Number of replicas
replicaCount: 1

# Image configuration
image:
  repository: otel/opentelemetry-collector-k8s
  tag: "0.108.1"
  pullPolicy: IfNotPresent

# Resources
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

# Service configuration
service:
  type: ClusterIP
  ports:
    # OTLP gRPC receiver
    otlp-grpc:
      enabled: true
      containerPort: 4317
      servicePort: 4317
      protocol: TCP
    # OTLP HTTP receiver
    otlp-http:
      enabled: true
      containerPort: 4318
      servicePort: 4318
      protocol: TCP
    # Prometheus metrics
    metrics:
      enabled: true
      containerPort: 8888
      servicePort: 8888
      protocol: TCP
    # Health check
    health-check:
      enabled: true
      containerPort: 13133
      servicePort: 13133
      protocol: TCP
    # Jaeger gRPC
    jaeger-grpc:
      enabled: true
      containerPort: 14250
      servicePort: 14250
      protocol: TCP
    # Jaeger thrift HTTP
    jaeger-thrift-http:
      enabled: true
      containerPort: 14268
      servicePort: 14268
      protocol: TCP
    # Zipkin
    zipkin:
      enabled: true
      containerPort: 9411
      servicePort: 9411
      protocol: TCP

# Ports configuration
ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    hostPort: 4317
    protocol: TCP
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP
  jaeger-grpc:
    enabled: true
    containerPort: 14250
    protocol: TCP
  jaeger-thrift-http:
    enabled: true
    containerPort: 14268
    protocol: TCP
  zipkin:
    enabled: true
    containerPort: 9411
    protocol: TCP
  metrics:
    enabled: true
    containerPort: 8888
    protocol: TCP

# Configuration
# Inline config (can be overridden by collector-config.yaml)
config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

    # Jaeger receiver
    jaeger:
      protocols:
        grpc:
          endpoint: 0.0.0.0:14250
        thrift_http:
          endpoint: 0.0.0.0:14268

    # Zipkin receiver
    zipkin:
      endpoint: 0.0.0.0:9411

    # Prometheus receiver for scraping metrics
    prometheus:
      config:
        scrape_configs:
          - job_name: 'otel-collector'
            scrape_interval: 30s
            static_configs:
              - targets: ['0.0.0.0:8888']

  processors:
    # Batch processor
    batch:
      timeout: 10s
      send_batch_size: 1024
      send_batch_max_size: 2048

    # Memory limiter
    memory_limiter:
      check_interval: 1s
      limit_mib: 400
      spike_limit_mib: 100

    # Resource processor to add K8s metadata
    resource:
      attributes:
        - key: service.instance.id
          from_attribute: k8s.pod.uid
          action: insert
        - key: k8s.cluster.name
          value: kind-cluster
          action: insert

    # K8s attributes processor
    k8sattributes:
      auth_type: serviceAccount
      passthrough: false
      extract:
        metadata:
          - k8s.namespace.name
          - k8s.deployment.name
          - k8s.statefulset.name
          - k8s.daemonset.name
          - k8s.cronjob.name
          - k8s.job.name
          - k8s.node.name
          - k8s.pod.name
          - k8s.pod.uid
          - k8s.pod.start_time
        labels:
          - tag_name: app.label.component
            key: app.kubernetes.io/component
            from: pod

  exporters:
    # Debug exporter for development
    debug:
      verbosity: detailed
      sampling_initial: 5
      sampling_thereafter: 200

    # OTLP exporter (for external backends)
    otlp:
      endpoint: localhost:4317
      tls:
        insecure: true

    # Prometheus exporter
    prometheus:
      endpoint: "0.0.0.0:8889"
      namespace: otel
      const_labels:
        cluster: kind-cluster

  extensions:
    # Health check extension
    health_check:
      endpoint: 0.0.0.0:13133

    # pprof extension for profiling
    pprof:
      endpoint: 0.0.0.0:1777

    # zpages extension
    zpages:
      endpoint: 0.0.0.0:55679

  service:
    extensions: [health_check, pprof, zpages]
    pipelines:
      # Traces pipeline
      traces:
        receivers: [otlp, jaeger, zipkin]
        processors: [memory_limiter, k8sattributes, resource, batch]
        exporters: [debug]

      # Metrics pipeline
      metrics:
        receivers: [otlp, prometheus]
        processors: [memory_limiter, k8sattributes, resource, batch]
        exporters: [debug, prometheus]

      # Logs pipeline
      logs:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, resource, batch]
        exporters: [debug]

# Service Account
serviceAccount:
  create: true
  annotations: {}

# RBAC
rbac:
  create: true

# Pod Security
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  fsGroup: 65534

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65534

# Service Monitor for Prometheus
serviceMonitor:
  enabled: true
  metricsEndpoints:
    - port: metrics
      interval: 30s

# Pod Monitor
podMonitor:
  enabled: false

# Autoscaling
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

# Pod annotations
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8888"
  prometheus.io/path: "/metrics"

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-host-path
  annotations:
    policies.kyverno.io/title: Restrict Host Path Volumes
    policies.kyverno.io/category: Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Host path volumes present security risks and should be restricted.
      This policy validates that pods do not use hostPath volumes except
      in system namespaces where they are required.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: disallow-host-path
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - kyverno
                - local-path-storage
      validate:
        message: "HostPath volumes are not allowed. Use persistent volumes instead."
        pattern:
          spec:
            =(volumes):
              - X(hostPath): "null"

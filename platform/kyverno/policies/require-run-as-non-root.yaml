apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-run-as-non-root
  annotations:
    policies.kyverno.io/title: Require Run As Non-Root User
    policies.kyverno.io/category: Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Containers should not run as the root user. This policy validates that
      containers have 'runAsNonRoot' set to true in their security context.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: run-as-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - kyverno
                - local-path-storage
      validate:
        message: "Containers must run as a non-root user. Set 'runAsNonRoot: true' in securityContext"
        anyPattern:
          - spec:
              securityContext:
                runAsNonRoot: true
              containers:
                - name: "*"
          - spec:
              containers:
                - name: "*"
                  securityContext:
                    runAsNonRoot: true

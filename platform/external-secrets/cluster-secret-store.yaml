apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: kubernetes-backend
  annotations:
    description: "Kubernetes native secret store for local development"
spec:
  provider:
    # Kubernetes provider - reads secrets from k8s cluster
    kubernetes:
      # Remote namespace to read secrets from
      # Use 'default' namespace for storing secrets in local dev
      remoteNamespace: default

      # Server configuration
      server:
        # Use in-cluster config
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: kube-system

      # Authentication via service account
      auth:
        serviceAccount:
          name: external-secrets
          namespace: external-secrets-system
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: kubernetes-secrets
  annotations:
    description: "Alternative Kubernetes secret store with broader access"
spec:
  provider:
    kubernetes:
      # Can read from any namespace
      remoteNamespace: default

      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: kube-system

      auth:
        serviceAccount:
          name: external-secrets
          namespace: external-secrets-system
---

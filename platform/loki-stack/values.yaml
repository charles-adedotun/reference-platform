# Loki Stack Helm values
# Log aggregation with Loki and Promtail

# Loki configuration
loki:
  enabled: true

  # Persistence
  persistence:
    enabled: true
    size: 10Gi
    accessModes:
      - ReadWriteOnce

  # Resources
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

  # Configuration
  config:
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096

    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    storage_config:
      tsdb_shipper:
        active_index_directory: /loki/index
        cache_location: /loki/index_cache

    limits_config:
      retention_period: 168h  # 7 days
      enforce_metric_name: false
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      max_entries_limit_per_query: 5000
      max_query_series: 500
      max_query_parallelism: 32
      ingestion_rate_mb: 10
      ingestion_burst_size_mb: 20
      per_stream_rate_limit: 3MB
      per_stream_rate_limit_burst: 15MB

    compactor:
      working_directory: /loki/compactor
      shared_store: filesystem
      retention_enabled: true
      retention_delete_delay: 2h
      retention_delete_worker_count: 150

    query_range:
      align_queries_with_step: true
      cache_results: true
      results_cache:
        cache:
          embedded_cache:
            enabled: true
            max_size_mb: 100

  # Service
  service:
    type: ClusterIP
    port: 3100

  # Service Monitor for Prometheus
  serviceMonitor:
    enabled: true
    interval: 30s
    additionalLabels:
      release: kube-prometheus-stack

# Promtail configuration
promtail:
  enabled: true

  # Resources
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

  # Configuration
  config:
    serverPort: 3101
    clients:
      - url: http://loki:3100/loki/api/v1/push
        tenant_id: 1

    positions:
      filename: /run/promtail/positions.yaml

    scrape_configs:
      # Kubernetes pod logs
      - job_name: kubernetes-pods
        pipeline_stages:
          - cri: {}
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          # Drop pods without proper labels
          - source_labels:
              - __meta_kubernetes_pod_controller_name
            regex: ([0-9a-z-.]+?)(-[0-9a-f]{8,10})?
            action: replace
            target_label: __tmp_controller_name

          # Add namespace label
          - source_labels:
              - __meta_kubernetes_namespace
            action: replace
            target_label: namespace

          # Add pod name label
          - source_labels:
              - __meta_kubernetes_pod_name
            action: replace
            target_label: pod

          # Add container name label
          - source_labels:
              - __meta_kubernetes_pod_container_name
            action: replace
            target_label: container

          # Add app label if exists
          - source_labels:
              - __meta_kubernetes_pod_label_app
            action: replace
            target_label: app

          # Add job label from app.kubernetes.io/name
          - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
            action: replace
            target_label: job

          # Set path to log file
          - source_labels:
              - __meta_kubernetes_pod_uid
              - __meta_kubernetes_pod_container_name
            action: replace
            separator: /
            target_label: __path__
            replacement: /var/log/pods/*$1/*.log

      # Kubernetes system pods
      - job_name: kubernetes-pods-system
        pipeline_stages:
          - cri: {}
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - kube-system
                - monitoring
        relabel_configs:
          - source_labels:
              - __meta_kubernetes_namespace
            action: replace
            target_label: namespace

          - source_labels:
              - __meta_kubernetes_pod_name
            action: replace
            target_label: pod

          - source_labels:
              - __meta_kubernetes_pod_container_name
            action: replace
            target_label: container

          - source_labels:
              - __meta_kubernetes_pod_uid
              - __meta_kubernetes_pod_container_name
            action: replace
            separator: /
            target_label: __path__
            replacement: /var/log/pods/*$1/*.log

  # Volume mounts for log collection
  volumeMounts:
    - name: pods
      mountPath: /var/log/pods
      readOnly: true
    - name: containers
      mountPath: /var/lib/docker/containers
      readOnly: true

  volumes:
    - name: pods
      hostPath:
        path: /var/log/pods
    - name: containers
      hostPath:
        path: /var/lib/docker/containers

  # Service Monitor for Prometheus
  serviceMonitor:
    enabled: true
    interval: 30s
    additionalLabels:
      release: kube-prometheus-stack

# Fluent Bit (disabled, using Promtail instead)
fluent-bit:
  enabled: false

# Grafana (disabled, using kube-prometheus-stack Grafana)
grafana:
  enabled: false

# Prometheus (disabled, using kube-prometheus-stack Prometheus)
prometheus:
  enabled: false
